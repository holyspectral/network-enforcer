extensions:
  file_storage:
    directory: /data/state
receivers:
  filelog:
    include: [/data/logs/*.log*]
    start_at: end
    poll_interval: 200ms
    force_flush_period: 0
    on_truncate: read_new
    storage: file_storage
processors:
  # Do the uniform per-line work: append the constant "ASD".
  transform:
    log_statements:
      - context: log
        statements:
          - set(body, Concat([body, "ASD"], ""))
exporters:
  file:
    path: /dev/stdout
service:
  extensions: [file_storage]
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [filelog]
      processors: [transform]
      exporters: [file]
