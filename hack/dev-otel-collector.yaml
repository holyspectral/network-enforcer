# Minimal, plaintext OpenTelemetry collector for local Tilt development only.
#
# It receives the controller's OTLP violation logs (policy_violation_observed /
# policy_deny) over insecure gRPC and prints every record — with all attributes —
# via the debug exporter, so violation events show up directly in the Tilt UI's
# logs for this resource.
#
# This is intentionally separate from the chart's `default` collector strategy,
# which requires cert-manager + the cert-manager CSI driver for mTLS and is
# heavier than we want for a local kind cluster. The controller is pointed here
# via the chart's `external` strategy (insecure, no certs) from the Tiltfile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-otel-collector
  namespace: network-enforcer
  labels:
    app.kubernetes.io/name: dev-otel-collector
    app.kubernetes.io/component: dev-otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    exporters:
      # verbosity: detailed prints the full log record, including every
      # violation attribute (source/destination workload, port, policy ref).
      debug:
        verbosity: detailed
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-otel-collector
  namespace: network-enforcer
  labels:
    app.kubernetes.io/name: dev-otel-collector
    app.kubernetes.io/component: dev-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-otel-collector
      app.kubernetes.io/component: dev-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-otel-collector
        app.kubernetes.io/component: dev-otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.158.0
        imagePullPolicy: IfNotPresent
        command:
        - /otelcol-contrib
        - --config=/etc/otel/config.yaml
        ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: health
          containerPort: 13133
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 13133
        readinessProbe:
          httpGet:
            path: /
            port: 13133
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/otel
          readOnly: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config
        configMap:
          name: dev-otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: dev-otel-collector
  namespace: network-enforcer
  labels:
    app.kubernetes.io/name: dev-otel-collector
    app.kubernetes.io/component: dev-otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dev-otel-collector
    app.kubernetes.io/component: dev-otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
    protocol: TCP
